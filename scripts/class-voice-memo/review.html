<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수업 메모 확인</title>
<style>
:root { --accent:#329BE7; --accent-d:#327AB8; --text:rgba(0,0,0,.85); --sub:rgba(0,0,0,.55); --muted:#A7A7AA; --line:#EFEFF0; --tint:#F7F7F8;
  --amber-bg:#FAEEDA; --amber-line:#FAC775; --amber-text:#854F0B; --ok:#31A552; --err:#E94E58; }
* { box-sizing:border-box; }
body { margin:0; background:var(--tint); color:var(--text); font:15px/1.6 -apple-system, "Noto Sans KR", sans-serif; }
main { max-width:760px; margin:0 auto; padding:20px 16px 80px; }
h1 { font-size:22px; margin:0; } h2 { font-size:17px; margin:0; } h3 { font-size:14px; margin:0; }
.top { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.card { background:#fff; border:1px solid var(--line); border-radius:20px; padding:18px; margin-bottom:16px; }
.student { border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:12px; }
.badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:8px; margin-left:6px; vertical-align:2px; }
.b-guess { background:#EDBC401A; color:#9A7414; border:1px solid #EDBC404D; }
.b-self { background:#E94E581A; color:var(--err); border:1px solid #E94E584D; }
.b-edit { background:#329BE71A; color:var(--accent-d); border:1px solid #329BE74D; }
.ed-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
.row-top { display:flex; align-items:center; gap:6px; }
select.who { font:13px inherit; padding:4px 8px; border:1px solid var(--amber-line); border-radius:8px; background:#fff; color:var(--amber-text); }
.sec { margin-top:12px; border-radius:12px; padding:12px 14px; }
.sec-coach { background:#fff; border:1px solid var(--line); }
.sec-check { background:var(--amber-bg); border:1px solid var(--amber-line); }
.unk { border-color:#EDBC404D; background:#EDBC401A; }
.unk-row { padding:10px 0; border-top:1px solid #EDBC404D; display:grid; gap:6px; }
.unk-row:first-of-type { border-top:none; }
.unk-row select { justify-self:start; }
.sec-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
.hint { font-size:12px; color:var(--sub); }
label.confirm { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; cursor:pointer; }
input[type=checkbox] { width:20px; height:20px; accent-color:var(--accent); flex:none; }
.sec-check input[type=checkbox] { accent-color:#BA7517; }
.diff { font-size:14px; white-space:pre-wrap; word-break:keep-all; border-radius:8px; overflow:hidden; border:1px solid var(--line); }
.diff div { padding:3px 10px; }
.diff .share { float:right; margin-left:8px; padding:0; font-size:12px; text-decoration:none; color:#BA7517; }
.d-same { color:var(--sub); }
.d-add { background:#31A5521A; }
.d-del { background:#E94E581A; color:var(--err); text-decoration:line-through; }
mark { background:#31A55240; color:inherit; border-radius:3px; padding:0 1px; }
textarea { width:100%; min-height:150px; font:14px/1.6 inherit; border:1px solid var(--line); border-radius:8px; padding:10px; }
.row { display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-top:1px solid #FAC77599; }
.row:first-of-type { border-top:none; }
.row .fields { flex:1; min-width:0; display:grid; gap:6px; }
.row input[type=text] { width:100%; font:14px inherit; padding:7px 9px; border:1px solid var(--amber-line); border-radius:8px; background:#fff; }
.row input.ex { font-weight:600; }
.warn { color:#9A7414; font-size:12px; }
.ex-wrap { position:relative; }
.cands { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
button.cand { padding:4px 10px; font-size:13px; border-radius:8px; border-color:var(--amber-line); color:var(--amber-text); }
button.cand.on { background:#BA7517; border-color:#BA7517; color:#fff; }
.ex-list { position:absolute; z-index:5; left:0; right:0; top:100%; margin:2px 0 0; padding:4px; list-style:none; background:#fff; border:1px solid var(--amber-line); border-radius:8px; max-height:220px; overflow:auto; box-shadow:0 6px 20px rgba(0,0,0,.12); }
.ex-list li { padding:6px 8px; border-radius:6px; cursor:pointer; font-size:14px; }
.ex-list li:hover, .ex-list li.on { background:var(--amber-bg); }
.ex-list li.none { color:var(--sub); cursor:default; background:none; }
.existing { font-size:12px; color:var(--amber-text); margin-top:6px; opacity:.8; }
details { margin-top:8px; font-size:13px; color:var(--sub); } summary { cursor:pointer; }
ul { margin:6px 0 0; padding-left:18px; }
button { font:600 14px inherit; border-radius:12px; padding:10px 16px; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--text); }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.link { border:none; background:none; color:var(--accent-d); padding:4px 0; font-size:13px; }
button:disabled { opacity:.5; cursor:default; }
.actions { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }
.status { font-size:13px; margin-top:8px; }
.ok { color:var(--ok); } .err { color:var(--err); }
.saved { opacity:.55; pointer-events:none; }
.summary { padding:12px 18px; font-size:14px; background:#329BE71A; border-color:#329BE74D; }
.empty { text-align:center; color:var(--sub); padding:60px 0; }
pre { white-space:pre-wrap; font-size:13px; background:var(--tint); padding:12px; border-radius:8px; }
</style>
</head>
<body>
<main>
  <div class="top"><h1>수업 메모 확인</h1><button id="reload">새로고침</button></div>
  <p class="hint" style="margin-top:-8px">체크하면 바로 앱에 저장돼요(체크한 항목만). 코치 전용 메모는 수강생에게 안 보이고, 체크리스트는 훈련일지에서 그 운동을 고르면 수강생에게 보여요. 코치 메모 줄 중 수강생도 알면 좋은 건 <b>→ 수강생에게도</b>를 누르면 체크리스트로 복사돼요.</p>
  <div id="toast" class="status"></div>
  <div id="root"><p class="empty">불러오는 중…</p></div>
</main>
<script>
const api = (url, body) => fetch(url, body ? { method: 'POST', headers: { 'X-CVM': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { headers: { 'X-CVM': '1' } })
  .then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; });
let EXERCISES = [];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// 줄 단위 비교(LCS) → 같은 줄 / 지워지는 줄 / 새 줄. 새 줄 안에서 원래 없던 말은 형광 표시.
function diffLines(a, b, share = false) {
  const A = a ? a.split('\n') : [], B = b ? b.split('\n') : [];
  const dp = Array.from({ length: A.length + 1 }, () => new Array(B.length + 1).fill(0));
  for (let i = A.length - 1; i >= 0; i--) for (let j = B.length - 1; j >= 0; j--)
    dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < A.length || j < B.length) {
    if (i < A.length && j < B.length && A[i] === B[j]) { out.push(['same', A[i]]); i++; j++; }
    else if (j < B.length && (i >= A.length || dp[i][j + 1] >= dp[i + 1][j])) out.push(['add', B[j++]]);
    else out.push(['del', A[i++]]);
  }
  // 고쳐진 줄(지워지는 줄과 단어가 30% 이상 겹침)만 바뀐 단어를 형광 표시. 통째로 새 줄은 초록 배경만.
  const dels = out.filter(([t]) => t === 'del').map(([, l]) => new Set(l.split(/\s+/)));
  const marked = (line) => {
    const words = line.split(/\s+/).filter(Boolean);
    let best = null, score = 0;
    for (const d of dels) { const s = words.filter(w => d.has(w)).length / (words.length || 1); if (s > score) { score = s; best = d; } }
    if (score < 0.3) return esc(line);
    return line.split(/(\s+)/).map(w => /\S/.test(w) && !best.has(w) ? `<mark>${esc(w)}</mark>` : esc(w)).join('');
  };
  const shareBtn = (t, line) => share && t !== 'del' && line.trim() ? `<button class="link share" data-line="${esc(line)}" title="이 줄을 수강생 체크리스트로도 추가">→ 수강생에게도</button>` : '';
  return out.map(([t, line]) => `<div class="d-${t}">${t === 'add' ? marked(line) : esc(line) || '&nbsp;'}${shareBtn(t, line)}</div>`).join('');
}

const label = f => { const m = /^(\d{4})-(\d{2})-(\d{2})_(\w+)교시/.exec(f); if (!m) return f;
  const d = new Date(`${m[1]}-${m[2]}-${m[3]}T00:00:00`); return `${+m[2]}/${+m[3]} (${'일월화수목금토'[d.getDay()]}) ${m[4] === 'x' ? '교시 확인 필요' : m[4] + '교시'}`; };

function studentHTML(p, s, si) {
  const id = `${p.file}::${si}`;
  const cn = s.coachNote;
  const items = s.checklist || [];
  // 저장 여부는 앱의 실제 값으로 판단 — 새로고침·재접속해도 정확하다
  const coachSaved = !!cn && (s.currentCoachNote || '').trim() === cn.proposed.trim();
  // 운동을 페이지에서 골랐으면 제안 파일엔 빈칸이라 문장만으로 저장 여부를 본다
  const itemSaved = it => (s.currentExerciseMemos || []).some(m => (!it.exercise || m.exercise === it.exercise) && m.memo === it.text);
  // 저장된 건 숨기고 남은 것만 보여준다(2026-10-27 사용자 요청). 남은 게 없으면 수강생 카드도 안 그린다.
  const showCoach = cn && !coachSaved;
  const left = items.map((it, ii) => [it, ii]).filter(([it]) => !itemSaved(it));
  if (!showCoach && !left.length) return '';
  const roster = (p.names || []);
  const who = (cur) => `<select class="who" aria-label="누구 메모인지">${roster.map(n => `<option${n === cur ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
  const editor = (text) => `<div class="editor" hidden>
      <textarea class="coach-text">${esc(text)}</textarea>
      <div class="ed-actions"><button class="ed-cancel">취소</button><button class="primary ed-ok">확인</button></div>
    </div>`;
  return `<div class="student" data-id="${esc(id)}" data-name="${esc(s.name)}">
    <h2>${esc(s.name)}${s.guessed ? `<span class="badge b-guess">이름 추정</span>` : ''}${s.maybeCoachSelf ? `<span class="badge b-self">코치 본인 얘기일 수 있음</span>` : ''}</h2>
    ${s.guessed && s.guessNote ? `<div class="hint">${esc(s.guessNote)}</div>` : ''}
    ${(s.evidence || []).length ? `<details><summary>녹음 근거 보기</summary><ul>${s.evidence.map(e => `<li>${esc(e)}</li>`).join('')}</ul></details>` : ''}
    ${showCoach ? `<div class="sec sec-coach" data-kind="coach">
      <div class="row-top" style="margin-bottom:6px">${who(s.name).replace('class="who"', 'class="who coach-who"')}<span class="hint">다른 사람 얘기면 이름을 바꾸세요</span></div>
      <div class="sec-head"><label class="confirm"><input type="checkbox" class="c-coach" data-key="${esc(p.file)}::${esc(s.name)}::coach"> 코치 전용 메모 이대로 저장${cn.edited ? `<span class="badge b-edit">직접 고침</span>` : ''}${cn.rebased ? `<span class="badge b-edit" title="이 제안을 만든 뒤 메모가 바뀌어 최신 메모 기준으로 다시 맞췄어요">최신 메모에 맞춤</span>` : ''}</label><span class="hint">수강생에게 안 보임</span></div>
      <div class="diff">${diffLines(s.currentCoachNote || '', cn.proposed, true)}</div>
      ${(cn.removed || []).length ? `<div class="hint" style="margin-top:6px">빠지는 내용: ${cn.removed.map(esc).join(' / ')}</div>` : ''}
      <button class="link edit">직접 고치기</button>
      ${editor(cn.proposed)}
    </div>` : cn ? '' : `<div class="sec sec-coach" data-kind="coach-new">
      <button class="link edit">+ 코치 전용 메모 추가</button>
      ${editor(s.currentCoachNote || '')}
    </div>`}
    ${left.length ? `<div class="sec sec-check" data-kind="check">
      <div class="sec-head"><h3 style="color:var(--amber-text)">✅ 수강생 체크리스트</h3><span class="hint" style="color:var(--amber-text)">훈련일지에서 보임</span></div>
      ${left.map(([it, ii]) => `<div class="row" data-index="${ii}">
        <input type="checkbox" class="c-item" style="margin-top:8px" data-key="${esc(p.file)}::${esc(s.name)}::item::${esc(it.exercise)}::${esc(it.text)}">
        <div class="fields">
          <div class="row-top">${who(s.name)}${it.moved ? `<span class="badge b-edit">옮김</span>` : ''}${it.fromCoach ? `<span class="badge b-edit">코치 메모에서</span>` : ''}</div>
          <div class="ex-wrap" data-cands="${esc(JSON.stringify((it.exerciseCandidates || []).filter(n => EXERCISES.includes(n))))}"><input type="text" class="ex" value="${esc(it.exercise)}" placeholder="🔍 어떤 운동에 넣을지 검색" autocomplete="off" aria-label="운동 이름 검색"></div>
          ${(it.exerciseCandidates || []).some(n => EXERCISES.includes(n)) && !EXERCISES.includes(it.exercise) ? `<div class="cands"><span class="hint">어느 운동인지 모르겠어요. 후보:</span>${it.exerciseCandidates.filter(n => EXERCISES.includes(n)).map(n => `<button class="cand" data-v="${esc(n)}">${esc(n)}</button>`).join('')}</div>` : ''}
          <input type="text" class="tx" value="${esc(it.text)}" aria-label="체크리스트 문장">
          <span class="warn"${EXERCISES.includes(it.exercise) ? ' hidden' : ''}>${it.exercise ? '앱 운동 목록에 없는 이름이에요. 목록에서 골라주세요.' : '운동을 골라주세요. 수강생이 훈련일지에서 그 운동을 고르면 보여요.'}</span>
        </div></div>`).join('')}
      ${(s.currentExerciseMemos || []).length ? `<div class="existing">이미 있는 항목: ${s.currentExerciseMemos.map(m => `${esc(m.exercise)} — ${esc(m.memo)}`).join(' / ')}</div>` : ''}
    </div>` : ''}
    <div class="status"></div>
  </div>`;
}

function render({ proposals, exerciseNames }) {
  EXERCISES = exerciseNames;
  const root = document.getElementById('root');
  // 남은 게 없는 수업(전부 저장됐거나 제안이 없음)은 안 띄우고 자동으로 닫는다
  for (const p of proposals) p.html = p.legacy ? '' : (p.students || []).map((s, i) => studentHTML(p, s, i)).join('');
  const done = proposals.filter(p => !p.legacy && !p.html && !(p.uncertain || []).length);
  done.forEach(p => api('/api/finish', { file: p.file }).catch(() => {}));
  proposals = proposals.filter(p => !done.includes(p));
  if (!proposals.length) { root.innerHTML = '<p class="empty">확인할 제안이 없어요. 수업 녹음이 처리되면 여기에 떠요.</p>'; return; }
  const summary = proposals.length > 1 ? `<div class="card summary">확인 안 한 수업 <b>${proposals.length}개</b>: ${proposals.map(p => label(p.file)).join(', ')} — 지난 수업부터 차례로 보여줘요.</div>` : '';
  root.innerHTML = summary + proposals.map(p => p.legacy
    ? `<section class="card" data-file="${esc(p.file)}"><h2>${label(p.file)} <span class="hint">(예전 형식)</span></h2><pre>${esc(p.raw)}</pre>
       <div class="actions"><button class="primary finish">확인 완료</button></div><div class="status"></div></section>`
    : `<section class="card" data-file="${esc(p.file)}">
       <h2>${label(p.file)}</h2>
       <div class="hint">녹음 ${p.minutes ? p.minutes + '분' : ''} · 후보 명단 ${esc((p.names || []).join(', ') || '없음')}</div>
       ${p.html}
       ${(p.uncertain || []).length ? `<div class="sec sec-coach unk">
         <div class="sec-head"><h3>❓ 누군지 모르는 메모</h3><span class="hint">넣을 곳과 이름을 고르면 그 사람 아래로 옮겨져요 — 확인 후 체크해야 저장</span></div>
         ${p.uncertain.map((u, ui) => { const o = typeof u === 'string' ? { line: u, candidates: [] } : u;
           const rest = (p.names || []).filter(n => !(o.candidates || []).includes(n));
           return `<div class="unk-row" data-index="${ui}">
             <div>${esc(o.line)}</div>
             ${o.why ? `<div class="hint">${esc(o.why)}</div>` : ''}
             <select class="who unk-as" aria-label="어디에 넣을지"><option value="coach">코치 전용 메모</option><option value="checklist">수강생 체크리스트</option></select>
             <select class="who unk-who" aria-label="누구 메모인지"><option value="">누구? 이름 고르기</option>
               ${(o.candidates || []).length ? `<optgroup label="후보">${o.candidates.map(n => `<option>${esc(n)}</option>`).join('')}</optgroup>` : ''}
               <optgroup label="이 수업 명단">${rest.map(n => `<option>${esc(n)}</option>`).join('')}</optgroup></select>
           </div>`; }).join('')}
       </div>` : ''}
       <div class="actions"><span class="hint" style="margin-right:auto;align-self:center">필요한 것만 체크하고 확인 완료 — 체크 안 한 건 버려요</span><button class="primary finish">확인 완료</button></div>
       <div class="status"></div>
     </section>`).join('');
}

async function load(extraChecked = []) {
  const keep = new Set([...document.querySelectorAll('input[type=checkbox]:checked')].map(c => c.dataset.key).filter(Boolean).concat(extraChecked));
  // 페이지에서 고른 운동·고친 문장은 제안 파일에 없다 — 다시 그려도 남게 한다(안 그러면 저장 대기 중이던 항목이 운동 빈칸으로 돌아가 저장이 안 됨)
  const vals = new Map([...document.querySelectorAll('.row')].map(r => [r.querySelector('.c-item').dataset.key, [r.querySelector('.ex').value, r.querySelector('.tx').value]]));
  const y = window.scrollY;
  try {
    render(await api('/api/proposals'));
    document.querySelectorAll('input[type=checkbox][data-key]').forEach(c => { if (keep.has(c.dataset.key)) c.checked = true; });
    document.querySelectorAll('.row').forEach(r => {
      const v = vals.get(r.querySelector('.c-item').dataset.key); if (!v) return;
      r.querySelector('.ex').value = v[0]; r.querySelector('.tx').value = v[1];
      const w = r.querySelector('.warn'); if (w) w.hidden = EXERCISES.includes(v[0].trim());
    });
    window.scrollTo(0, y);
    extraChecked.forEach(k => { const c = document.querySelector(`input[data-key="${CSS.escape(k)}"]`); if (c) autoSave(c); });
  }
  catch (e) { document.getElementById('root').innerHTML = `<p class="empty err">불러오지 못했어요: ${esc(e.message)}</p>`; }
}

// 자동 저장: 체크하거나 체크된 항목을 고치면 그 수강생 것만 0.5초 뒤 저장. 수강생별로 한 번에 하나씩 순서대로.
const timers = new Map(), queues = new Map();
function autoSave(node) {
  const el = node.closest('.student'); if (!el) return;
  const key = `${el.closest('section.card').dataset.file}::${el.dataset.name}`;
  clearTimeout(timers.get(key));
  timers.set(key, setTimeout(() => queues.set(key, (queues.get(key) || Promise.resolve()).then(() => saveStudent(key))), 500));
}
async function saveStudent(key) {
  const [file, name] = key.split('::');
  const sel = `section.card[data-file="${CSS.escape(file)}"] .student[data-name="${CSS.escape(name)}"]`;
  let el = document.querySelector(sel); if (!el) return true;
  const st = el.querySelector('.status');
  const coachBox = el.querySelector('.c-coach:checked:not(:disabled)');
  const rows = [...el.querySelectorAll('.row:not(.saved)')].filter(r => r.querySelector('.c-item').checked);
  const ok = r => { const v = r.querySelector('.ex').value.trim(); return v && (!EXERCISES.length || EXERCISES.includes(v)); };
  const items = rows.filter(ok).map(r => ({ exercise: r.querySelector('.ex').value.trim(), text: r.querySelector('.tx').value }));
  const waiting = rows.length - items.length;
  if (!coachBox && !items.length) { if (waiting) st.innerHTML = '<span class="warn">운동을 고르면 바로 저장돼요.</span>'; return !waiting; }
  st.innerHTML = '<span class="hint">저장 중…</span>';
  try {
    // 최신 메모 기준으로 저장(그사이 다른 곳에서 바뀌었으면 서버가 막는다)
    const s = (await api('/api/proposals')).proposals.find(x => x.file === file)?.students.find(x => x.name === name);
    const coach = coachBox ? { text: el.querySelector('.coach-text').value, expect: s?.currentCoachNote ?? '' } : null;
    await api('/api/save', { name, coachNote: coach, exerciseItems: items });
    await load();
    // 저장된 건 화면에서 빠지므로 위쪽 알림으로 알려준다
    document.getElementById('toast').innerHTML = `<span class="ok">✓ ${esc(name)} 저장됨</span>${waiting ? ' <span class="warn">운동을 안 고른 항목은 고르면 저장돼요.</span>' : ''}`;
    return !waiting;
  } catch (err) { st.innerHTML = `<span class="err">저장 실패: ${esc(err.message)}</span>`; return false; }
}

// 운동 검색: 앱 운동 목록에서만 고르게 한다(목록 밖 이름이면 수강생 화면에 안 뜬다)
const norm = v => v.toLowerCase().replace(/\s+/g, '');
function showExList(input) {
  const wrap = input.closest('.ex-wrap');
  wrap.querySelector('.ex-list')?.remove();
  const q = norm(input.value);
  const cands = JSON.parse(wrap.dataset.cands || '[]'); // AI가 고른 후보를 맨 위에
  const hits = [...cands, ...EXERCISES.filter(n => !cands.includes(n))].filter(n => !q || norm(n).includes(q));
  wrap.insertAdjacentHTML('beforeend', `<ul class="ex-list">${hits.length ? hits.map((n, i) => `<li data-v="${esc(n)}"${i ? '' : ' class="on"'}>${cands.includes(n) ? '⭐ ' : ''}${esc(n)}</li>`).join('') : '<li class="none">찾는 운동이 없어요</li>'}</ul>`);
}
function pickEx(input, v) {
  input.value = v;
  input.closest('.ex-wrap').querySelector('.ex-list')?.remove();
  const w = input.closest('.fields').querySelector('.warn');
  if (w) w.hidden = EXERCISES.includes(v);
  input.closest('.fields').querySelectorAll('.cand').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  autoSave(input);
}
document.addEventListener('focusin', e => { if (e.target.classList.contains('ex')) { e.target.select(); showExList(e.target); } });
document.addEventListener('input', e => {
  if (!e.target.classList.contains('ex')) return;
  showExList(e.target);
  const w = e.target.closest('.fields').querySelector('.warn');
  if (w) w.hidden = EXERCISES.includes(e.target.value.trim());
});
document.addEventListener('keydown', e => {
  const t = e.target; if (!t.classList.contains('ex')) return;
  const ul = t.closest('.ex-wrap').querySelector('.ex-list'); if (!ul) return;
  const lis = [...ul.querySelectorAll('li[data-v]')], i = lis.findIndex(l => l.classList.contains('on'));
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (!lis.length) return;
    const n = (i + (e.key === 'ArrowDown' ? 1 : -1) + lis.length) % lis.length;
    lis.forEach(l => l.classList.remove('on')); lis[n].classList.add('on'); lis[n].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') { e.preventDefault(); if (lis[i]) pickEx(t, lis[i].dataset.v); }
  else if (e.key === 'Escape') ul.remove();
});
document.addEventListener('mousedown', e => {
  const li = e.target.closest('.ex-list li[data-v]');
  if (li) { e.preventDefault(); pickEx(li.closest('.ex-wrap').querySelector('.ex'), li.dataset.v); return; }
  if (!e.target.closest('.ex-wrap')) document.querySelectorAll('.ex-list').forEach(u => u.remove());
});

// 체크리스트 항목이 다른 수강생 얘기면 '누구'를 바꿔 옮긴다
document.addEventListener('change', async (e) => {
  const t = e.target;
  if ((t.matches('.c-coach, .c-item') && t.checked) || t.matches('.row .tx, .row .ex, .coach-text')) return autoSave(t);
  if (t.classList.contains('unk-as')) return; // 넣을 곳만 고른 상태 — 이름을 고를 때 반영
  if (t.classList.contains('unk-who')) {
    // 누군지 모르는 메모 → 고른 사람 코치 전용 메모(또는 수강생 체크리스트)에 붙이고 체크해 둔다
    const card = t.closest('section.card'), name = t.value, row = t.closest('.unk-row');
    if (!name) return;
    const as = row.querySelector('.unk-as').value;
    try {
      await api('/api/patch', { file: card.dataset.file, op: 'assignUncertain', index: +row.dataset.index, to: name, as });
      // 붙이기만 하고 체크는 코치가 직접 — 체크리스트는 운동을 고른 뒤, 코치 전용 메모는 내용 확인 후(이름만 골라도 저장되던 문제)
      await load();
      document.querySelector(`.student[data-name="${CSS.escape(name)}"]`)?.scrollIntoView({ block: 'center' });
    } catch (err) { card.querySelector(':scope > .status').innerHTML = `<span class="err">${esc(err.message)}</span>`; t.value = ''; }
    return;
  }
  if (t.classList.contains('coach-who')) {
    // 코치 전용 메모가 다른 사람 얘기면 새로 넣는 줄을 그 사람 메모로 옮긴다(옮긴 쪽은 체크해서 바로 저장하지 않음 — 확인 후 체크)
    const card = t.closest('section.card'), st = t.closest('.student');
    try {
      await api('/api/patch', { file: card.dataset.file, op: 'moveCoach', from: st.dataset.name, to: t.value });
      await load();
      document.querySelector(`.student[data-name="${CSS.escape(t.value)}"]`)?.scrollIntoView({ block: 'center' });
    } catch (err) { st.querySelector('.status').innerHTML = `<span class="err">${esc(err.message)}</span>`; t.value = st.dataset.name; }
    return;
  }
  if (!t.classList.contains('who')) return;
  const card = t.closest('section.card'), st = t.closest('.student'), row = t.closest('.row');
  try {
    await api('/api/patch', { file: card.dataset.file, op: 'moveItem', from: st.dataset.name, index: +row.dataset.index, to: t.value });
    await load();
  } catch (err) { st.querySelector('.status').innerHTML = `<span class="err">${esc(err.message)}</span>`; t.value = st.dataset.name; }
});

document.addEventListener('click', async (e) => {
  const t = e.target;
  if (t.id === 'reload') return load();
  if (t.classList.contains('cand')) { t.closest('.row').querySelector('.c-item').checked = true; pickEx(t.closest('.fields').querySelector('.ex'), t.dataset.v); return; }
  if (t.classList.contains('edit')) { const ed = t.nextElementSibling; ed.hidden = false; t.hidden = true; ed.querySelector('textarea').focus(); return; }
  if (t.classList.contains('ed-cancel')) { const ed = t.closest('.editor'); ed.hidden = true; ed.previousElementSibling.hidden = false; return; }
  if (t.classList.contains('share')) {
    // 코치 전용 메모 줄을 수강생 체크리스트에도 넣고 체크(운동이 정해져 있으면 바로 저장)
    const card = t.closest('section.card'), st = t.closest('.student'), text = t.dataset.line.trim();
    try {
      await api('/api/patch', { file: card.dataset.file, op: 'shareLine', student: st.dataset.name, text });
      await load();
      const row = [...document.querySelectorAll(`.student[data-name="${CSS.escape(st.dataset.name)}"] .row`)].find(r => r.querySelector('.tx').value === text);
      if (row) { row.querySelector('.c-item').checked = true; autoSave(row); (row.querySelector('.ex').value ? row.querySelector('.tx') : row.querySelector('.ex')).focus(); }
    } catch (err) { st.querySelector('.status').innerHTML = `<span class="err">${esc(err.message)}</span>`; }
    return;
  }
  if (t.classList.contains('ed-ok')) {
    // 고친 문구를 제안에 반영 → 비교 화면이 고친 내용으로 다시 그려지고 체크되어 바로 저장된다
    const card = t.closest('section.card'), st = t.closest('.student');
    try {
      await api('/api/patch', { file: card.dataset.file, op: 'coachNote', student: st.dataset.name, text: t.closest('.editor').querySelector('textarea').value });
      await load([`${card.dataset.file}::${st.dataset.name}::coach`]);
    } catch (err) { st.querySelector('.status').innerHTML = `<span class="err">${esc(err.message)}</span>`; }
    return;
  }
  const card = t.closest('section.card');
  if (!card) return;
  const status = card.querySelector(':scope > .status');
  if (t.classList.contains('finish')) {
    // 확인 완료: 체크한 것 중 아직 안 들어간 걸 마저 저장하고, 체크 안 한 건 버리고 이 수업을 닫는다
    const file = card.dataset.file;
    t.disabled = true; status.innerHTML = '<span class="hint">저장 중…</span>';
    const keys = [...card.querySelectorAll('.student')].filter(el => el.querySelector('.c-coach:checked, .c-item:checked'))
      .map(el => `${file}::${el.dataset.name}`);
    for (const key of keys) {
      clearTimeout(timers.get(key));
      await queues.get(key);
      if (!(await saveStudent(key))) {
        const c = document.querySelector(`section.card[data-file="${CSS.escape(file)}"]`);
        if (c) { c.querySelector(':scope > .status').innerHTML = '<span class="err">저장 못 한 항목이 있어요(운동 미선택·저장 실패). 고치거나 체크를 풀고 다시 눌러주세요.</span>'; c.querySelector('.finish').disabled = false; }
        return;
      }
    }
    await api('/api/finish', { file }).catch(() => {}); // 다 저장돼 이미 자동으로 닫혔을 수 있다
    await load();
    document.getElementById('toast').innerHTML = `<span class="ok">✓ ${esc(label(file))} 확인 완료</span>`;
  }
});
load();
</script>
